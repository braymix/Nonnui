name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test e build APK debug
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rinomina APK
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          cp app/build/outputs/apk/debug/app-debug.apk "EasyHomeSenior-${SHORT_SHA}.apk"
          echo "APK_NAME=EasyHomeSenior-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyHomeSenior-debug-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # Release "ultima-build": link fisso e scaricabile direttamente dal browser del telefono.
      - name: Pubblica release ultima-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-build --yes --cleanup-tag || true
          gh release create ultima-build "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Ultima build (${GITHUB_REF_NAME})" \
            --notes "APK di test compilato automaticamente dal commit ${GITHUB_SHA} sul branch ${GITHUB_REF_NAME}. Scarica il file .apk qui sotto e aprilo dal telefono per installarlo."
